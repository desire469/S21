global:
  resolve_timeout: 5m
  smtp_smarthost: 'smtp.gmail.com:587'
  smtp_from: 'my_email'
  smtp_auth_username: 'my_email'
  smtp_auth_password: 'app_password'
  smtp_require_tls: true

route:
  group_by: ['alertname', 'severity']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 1h
  receiver: 'both'   

  routes:
    - match:
        severity: critical
      receiver: 'both'
      continue: true   
    - match:
        severity: warning
      receiver: 'email'   

receivers:
  - name: 'email'
    email_configs:
      - to: 'my_email'
        require_tls: true

  - name: 'both'
    email_configs:
      - to: 'my_email'
        require_tls: true
    webhook_configs:
      - url: 'http://telegram_webhook:8080/alert'
        send_resolved: true