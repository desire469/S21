version: '3.8'

services:
  prometheus:
    image: prom/prometheus:latest
    
    hostname: prometheus
    restart: unless-stopped
    expose:
      - "9090"
    ports:
      - "9090:9090"
    volumes:
      - /home/vagrant/metrics/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - /var/run/docker.sock:/var/run/docker.sock:ro  
      - /home/vagrant/metrics/alert/rules.yml:/etc/prometheus/rules.yml
    networks:
      - monitoring
      - shared
  promtail:
    image: grafana/promtail:latest
    hostname: promtail
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    configs:
      - source: promtail_config
        target: /etc/promtail/config.yml
    command: -config.file=/etc/promtail/config.yml
    networks:
      - monitoring
      - shared
    deploy:
      mode: global
      placement:
        constraints:
          - node.platform.os == linux

  alertmanager:
    image: prom/alertmanager:latest
    hostname: alertmanager
    ports:
      - "9093:9093"
    configs:
      - source: alertmanager_config
        target: /etc/alertmanager/alertmanager.yml
    networks:
      - monitoring
      - shared

  telegram_webhook:
    image: ghcr.io/d13410n3/am-telegram:latest
    environment:
      - TELEGRAM_BOT_TOKEN=token
      - TELEGRAM_CHAT_ID=chat
      - GRAFANA_BASE_URL=http://grafana:3000
      - PROM_BASE_URL=http://prometheus:9090
      - AM_BASE_URL=http://alertmanager:9093
    ports:
      - "8080:8080"
    networks:
      - monitoring
      - shared

  loki:
    
    hostname: loki
    image: grafana/loki:latest
    expose:
      - "3100"
    ports:
      - "3100:3100"

    networks:
      - monitoring
      - shared
  
  grafana:
    image: grafana/grafana:latest
    hostname: grafana
    expose:
      - "3000"
    volumes:
      - grafana-storage:/var/lib/grafana
      - /home/vagrant/metrics/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - /home/vagrant/metrics/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    networks:
      - monitoring
  
  node_exporter:
    image: prom/node-exporter:latest
    
    hostname: nodeexporter
    restart: unless-stopped
    expose:
      - "9100"
    networks:
      - monitoring

  blackbox_exporter:
    image: prom/blackbox-exporter:latest
    
    hostname: blackboxexporter
    restart: unless-stopped
    expose:
      - "9115"
    networks:
      - monitoring

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    
    hostname: cadvisor
    restart: unless-stopped
    expose:
      - "8080"
    networks:
      - monitoring
    volumes:
        - /:/rootfs:ro
        - /var/run:/var/run:ro
        - /sys:/sys:ro
        - /var/lib/docker/:/var/lib/docker:ro
        - /dev/disk/:/dev/disk:ro 
    deploy:
      mode: global
      placement:
        constraints:
          - node.platform.os == linux

volumes:
  grafana-storage:
    external: true
configs:
  loki_config:
    file: /home/vagrant/metrics/loki/loki-config.yml
  promtail_config:
    file: /home/vagrant/metrics/promtail/promtail-config.yml
  alertmanager_config:
    file: /home/vagrant/metrics/alert/alertmanager.yml
networks:
  monitoring:
    driver: overlay
  shared:
    external: true