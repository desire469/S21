apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: service
  name: ${LOYALTY_NAME}
spec:
  replicas: 1
  strategy:
    type: Recreate 
  selector:
    matchLabels:
      app: ${LOYALTY_NAME}
  template:
    metadata:
      labels:
        app: ${LOYALTY_NAME}
    spec:
      containers:
      - name: ${LOYALTY_NAME}
        image: xedll/loyalty-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: ${LOYALTY_SERVICE_PORT}
        env:
        - name: POSTGRES_HOST
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: POSTGRES_HOST
        - name: POSTGRES_PORT
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: POSTGRES_PORT
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: POSTGRES_PASSWORD
        - name: POSTGRES_DB
          value: "balances_db"
        - name: AUTH_TOKEN
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: AUTH_TOKEN
---
apiVersion: v1
kind: Service
metadata:
  namespace: service
  name: ${LOYALTY_NAME}
spec:
  selector:
    app: ${LOYALTY_NAME}
  ports:
  - port: ${LOYALTY_SERVICE_PORT}
    targetPort: ${LOYALTY_SERVICE_PORT}