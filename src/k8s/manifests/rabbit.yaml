apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: service
  name: rabbit-service
spec:
  replicas: 1
  strategy:
    type: Recreate 
  selector:
    matchLabels:
      app: rabbit-service
  template:
    metadata:
      labels:
        app: rabbit-service
    spec:
      containers:
      - name: rabbit-service
        image: rabbitmq:3-management-alpine
        ports:
        - containerPort: 5672
        - containerPort: 15672
        env:
        - name: RABBITMQ_DEFAULT_USER
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: RABBIT_MQ_USER
        - name: RABBITMQ_DEFAULT_PASS
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: RABBIT_MQ_PASSWORD
---
apiVersion: v1
kind: Service
metadata:
  namespace: service
  name: rabbit-service
spec:
  selector:
    app: rabbit-service
  ports:
  - name: amqp
    port: 5672
    targetPort: 5672
  - name: management
    port: 15672
    targetPort: 15672