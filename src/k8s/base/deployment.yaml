apiVersion: apps/v1
kind: Deployment
metadata:
    name: postgres-service
spec:
  replicas: 1
  strategy:
    type: Recreate 
  selector:
    matchLabels:
      app: postgres-service
  template:
    metadata:
      labels:
        app: postgres-service
    spec:
      containers:
      - name: postgres-service
        image: postgres:13-alpine
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: POSTGRES_PASSWORD
        - name: POSTGRES_DB
          value: "postgres"
        volumeMounts:
        - name: postgres-storage
          mountPath: /var/lib/postgresql/data
          subPath: pgdata   

        - name: postgres-init-script
          mountPath: /docker-entrypoint-initdb.d
          readOnly: true
          
      volumes:
      - name: postgres-storage
        persistentVolumeClaim:
          claimName: postgres-pvc

      - name: postgres-init-script
        configMap:
            name: postgres-init-script
            defaultMode: 0755

