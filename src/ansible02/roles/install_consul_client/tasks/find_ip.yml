---
- name: Find Vagrant private network IP (192.168.56.x)
  set_fact:
    consul_client_ip: "{{ ansible_facts['all_ipv4_addresses'] | select('match', '^192\\.168\\.56\\.') | first }}"
  when: ansible_facts['all_ipv4_addresses'] | select('match', '^192\\.168\\.56\\.') | list | length > 0

- name: Fallback to eth1 interface if available
  set_fact:
    consul_client_ip: "{{ ansible_eth1.ipv4.address }}"
  when: 
    - consul_client_ip is not defined
    - ansible_eth1 is defined

- name: Final fallback to default IP
  set_fact:
    consul_client_ip: "{{ ansible_default_ipv4.address }}"
  when: consul_client_ip is not defined

- name: Debug the detected IP
  debug:
    msg: "Detected Consul client IP: {{ consul_client_ip }}"
